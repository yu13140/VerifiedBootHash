import com.android.build.gradle.internal.tasks.CompileArtProfileTask
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def gitCommitCount
try {
    gitCommitCount = providers.exec {
        commandLine("git", "rev-list", "--count", "HEAD")
    }.standardOutput.asText.get().toInteger()
} catch (ignored) {
    gitCommitCount = 1
}

def properties = new Properties()
def local = project.rootProject.file("local.properties")
if (local.exists()) {
    properties.load(local.newDataInputStream())
}

android {
    compileSdk = 35
    buildToolsVersion = '35.0.1'
    namespace = 'com.yu13140.verifiedboothash'
    defaultConfig {
        minSdk = 24
        targetSdk = 35
        versionCode = gitCommitCount
        versionName = "1.0.${gitCommitCount}"
    resourceConfigurations = ['en']
        optimization {
            keepRules {
                ignoreFromAllExternalDependencies true
            }
        }
    }

    signingConfigs {
        debug {
            if (properties.getProperty("storeFile") != null) {
                storeFile file(properties.getProperty("storeFile"))
                storePassword properties.getProperty("storePassword")
                keyAlias properties.getProperty("keyAlias")
                keyPassword properties.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        debug {
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            vcsInfo.include false
            signingConfig signingConfigs.debug
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
        options.languageVersion = KotlinVersion.KOTLIN_2_1
        options.progressiveMode = true
    }

    buildFeatures {
        viewBinding = false
        buildConfig = true
    aidl = false
    }

    packagingOptions {
        resources {
            excludes += '**'
        }
    }

    androidResources {
    // Disable locale config generation so resources.properties is not required
    generateLocaleConfig false
    }

    installation {
        installOptions += ["--user 0"]
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
        disable 'AppCompatResource'
    }
    dependenciesInfo.includeInApk false
}

tasks.withType(CompileArtProfileTask.class).configureEach {
    enabled = false
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
}

